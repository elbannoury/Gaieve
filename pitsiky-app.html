<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pitsiky App</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Pitsiky">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
</head>
<body style="margin:0;padding:0;overflow:hidden;">
    <iframe src="https://pitsiky.com" 
            style="position:fixed;top:0;left:0;width:100%;height:100%;border:none;">
    </iframe>
    
    <script>
        // iOS Detection
        if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
            document.head.innerHTML += '<meta name="apple-mobile-web-app-status-bar-style" content="black">';
        }
        
        // Add to Homescreen Prompt
        window.addEventListener('load', () => {
            if (window.navigator.standalone) {
                console.log('تم التثبيت كتطبيق');
            } else if (window.matchMedia('(display-mode: standalone)').matches) {
                console.log('يعمل في وضع التطبيق');
            }
        });
    </script>
</body>
</html>
